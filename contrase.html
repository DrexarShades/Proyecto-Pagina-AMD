<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="scripts/tailwind.js"></script>
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/favicon.ico">
</head>

<body>
<div class="bg-gradient-to-r from-red-500 via-red-600 to-red-800 transition-all duration-500 min-h-screen flex items-center justify-center p-4">
       <div class="p-6 sm:p-8 rounded-2xl bg-gray-100 border border-gray-200 shadow-sm">
    <form action="login.html">
        <img src="img/amd-logo.png" alt="logo" class="w-24 mb-4 mx-auto block shadow-lg border-gray-900 border-2" />
        <h1 id="form-title" class="text-slate-900 text-center text-3xl font-semibold mb-4">Recuperar Contraseña</h1>
        <div id="email-field">
          <label class="text-slate-900 text-sm font-medium mb-2 block">Ingresa tu correo electrónico</label>
          <p class="text-slate-900 text-sm font-medium mb-6">Te enviaremos un correo con un enlace para recuperar tu contraseña</p>
          <div class="relative flex items-center">
            <input name="email" type="email" class="w-full text-slate-900 text-sm border border-slate-300 px-4 py-3 pr-10 rounded-md outline-red-600 " placeholder="correo@ejemplo.com" required />
            <i class="fa-solid fa-envelope absolute right-4 text-gray-400"></i>
          </div>
          <p class="text-slate-900 text-sm font-medium my-6 text-center">¿No tienes una cuenta? <a href="login.html" class="text-red-600 hover:underline font-semibold">Regístrate aquí</a></p>
          <p class="text-slate-900 text-sm font-medium my-6 text-center">¿Ya tienes una cuenta? <a href="login.html" class="text-red-600 hover:underline font-semibold">Inicia sesión</a></p>
        </div>
        <div class="!mt-10">
          <button type="submit" class="w-full py-2 px-4 text-[15px] font-medium tracking-wide rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none transition duration-500">
            Enviar
          </button>
        </div>

    </form>
    </div>
</div>

</body>

</html>
